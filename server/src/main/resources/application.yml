spring:
  application:
    name: tripshare-server

  config:
    import: optional:classpath:application-local.yml

  datasource:
    url: jdbc:mysql://localhost:3306/tripshare?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

server:
  port: 8080

tripshare:
  cors:
    allowed-origins: "*"
